<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달력 찢어지는 애니메이션</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #ffffff;
      font-family: 'Arial Black', Impact, sans-serif;
      overflow: hidden;
    }

    .calendar-wrapper {
      position: relative;
      width: 260px;
      height: 270px;
      cursor: pointer;
    }

    /* 상단 파란색 헤더 (DAY) */
    .calendar-header {
      width: 100%;
      height: 75px;
      background-color: #000b58;
      border-radius: 16px 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8c9eff;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
      position: relative;
      z-index: 10;
    }

    /* 하단 날짜 영역 컨테이너 */
    .calendar-body {
      position: relative;
      width: 100%;
      height: 195px;
    }

    /* 공통 페이지 스타일 */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f3f3f3;
      border-radius: 0 0 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 130px;
      font-weight: 900;
      color: #8c9eff;
    }

    /* 다음 날짜 페이지 (바닥에 깔려있는 페이지) */
    .page-next {
      z-index: 1;
    }

    /* 현재 날짜 페이지 (점점 잘려나갈 페이지) */
    .page-current {
      z-index: 2;
    }

    /* 접히고 찢어지는 종이 뒷면 효과를 그릴 SVG 레이어 */
    .flap-svg {
      position: absolute;
      top: -200px;
      left: -200px;
      width: 800px;
      height: 700px;
      z-index: 5;
      pointer-events: none;
      overflow: visible;
    }

    .flap-polygon {
      fill: #e2e2e2; /* 종이 뒷면 색상 */
      stroke: #dcdcdc;
      stroke-width: 1px;
      stroke-linejoin: round;
      filter: drop-shadow(-4px 4px 8px rgba(0, 0, 0, 0.08));
    }

    .controls {
      margin-top: 40px;
      z-index: 20;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #000b58;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #1a2678;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- 달력 본체 -->
  <div class="calendar-wrapper" id="calendar">
    <div class="calendar-header">DAY</div>
    <div class="calendar-body">
      <!-- 뒤에 대기 중인 다음 날짜 -->
      <div class="page page-next" id="pageNext">2</div>
      
      <!-- 앞에 보이는 현재 날짜 -->
      <div class="page page-current" id="pageCurrent">1</div>

      <!-- 찢어지는 종이 뒷면 그래픽 -->
      <svg class="flap-svg" viewBox="-200 -200 800 700">
        <polygon class="flap-polygon" id="flapPolygon" points="" />
      </svg>
    </div>
  </div>

  <div class="controls">
    <button id="tearBtn">달력 넘기기 (클릭)</button>
  </div>

  <script>
    const pageCurrent = document.getElementById('pageCurrent');
    const pageNext = document.getElementById('pageNext');
    const flapPolygon = document.getElementById('flapPolygon');
    const tearBtn = document.getElementById('tearBtn');
    const calendar = document.getElementById('calendar');

    const W = 260; // 달력 가로 길이
    const H = 195; // 달력 본문 세로 길이
    let currentDay = 1;
    let isAnimating = false;

    // 특정 직선(P1 -> P2)을 기준으로 점 P를 대칭 이동(반사)시키는 함수
    function reflectPoint(p, p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const a = (dx * dx - dy * dy) / (dx * dx + dy * dy);
      const b = (2 * dx * dy) / (dx * dx + dy * dy);
      const x = a * (p.x - p1.x) + b * (p.y - p1.y) + p1.x;
      const y = b * (p.x - p1.x) - a * (p.y - p1.y) + p1.y;
      return { x, y };
    }

    function triggerTearAnimation() {
      if (isAnimating) return;
      isAnimating = true;

      const nextDay = currentDay + 1;
      pageNext.textContent = nextDay;

      const duration = 850; // 전체 애니메이션 시간 (0.85초)
      const startTime = performance.now();

      // 1단계가 끝날 때의 접히는 선 위치 (상단 P1, 하단 P2)
      const endP1 = { x: W * 0.78, y: 0 };
      const endP2 = { x: W, y: H };

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // 1단계 (0% ~ 45%): 왼쪽에서 오른쪽으로 대각선으로 말리며 벗겨지는 구간
        if (progress < 0.45) {
          const p = progress / 0.45;
          const ease = 1 - Math.pow(1 - p, 2); // 부드러운 감속 (Ease-Out)

          // 접히는 선(Crease Line)의 이동
          const p1 = { x: 15 + ease * (endP1.x - 15), y: 0 };
          const p2 = { x: ease * endP2.x, y: H };

          // 현재 페이지 오른쪽 남은 영역 클리핑
          pageCurrent.style.clipPath = `polygon(${p1.x}px 0px, ${W}px 0px, ${W}px ${H}px, ${p2.x}px ${H}px)`;

          // 잘려나간 왼쪽 영역을 대칭 이동시켜 회색 뒷면 생성
          const rTopLeft = reflectPoint({ x: 0, y: 0 }, p1, p2);
          const rBottomLeft = reflectPoint({ x: 0, y: H }, p1, p2);

          flapPolygon.setAttribute(
            'points',
            `${p1.x},${p1.y} ${rTopLeft.x},${rTopLeft.y} ${rBottomLeft.x},${rBottomLeft.y} ${p2.x},${p2.y}`
          );
          flapPolygon.style.transform = 'none';
          flapPolygon.style.opacity = '1';

        } 
        // 2단계 (45% ~ 100%): 완전히 뜯겨서 내려가지 않고 오른쪽으로 날아가며 사라지는 구간
        else {
          const p = (progress - 0.45) / 0.55; // 0 ~ 1 정규화
          const easeOut = 1 - Math.pow(1 - p, 3); // 자연스럽게 뻗어나가는 감속

          // 기존 페이지 완전히 숨김 (숫자 2 완전히 노출)
          pageCurrent.style.clipPath = `polygon(${W}px 0px, ${W}px 0px, ${W}px ${H}px, ${W}px ${H}px)`;

          // 1단계가 끝난 시점의 대칭 형태를 기준으로 전체 종이 뒷면 좌표 구성 (끊김 방지)
          const rTopLeft = reflectPoint({ x: 0, y: 0 }, endP1, endP2);
          const rBottomLeft = reflectPoint({ x: 0, y: H }, endP1, endP2);
          const rTopRight = reflectPoint({ x: W, y: 0 }, endP1, endP2);

          flapPolygon.setAttribute(
            'points',
            `${rTopRight.x},${rTopRight.y} ${rTopLeft.x},${rTopLeft.y} ${rBottomLeft.x},${rBottomLeft.y} ${endP2.x},${endP2.y}`
          );

          // 내려가지 않고(moveY <= 0) 오른쪽으로 날아가는 변환 적용
          const moveX = easeOut * 220;   // 오른쪽으로 220px 이동
          const moveY = -easeOut * 25;   // 내려가지 않고 살짝 위쪽(-25px)으로 부양하며 이동
          const rotate = -easeOut * 12;  // 오른쪽 위를 향해 살짝 더 회전

          flapPolygon.style.transformOrigin = `${endP2.x}px ${endP2.y}px`;
          flapPolygon.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg)`;
          
          // 날아가는 시작점부터 끝점까지 부드럽게 투명해지며 소멸 (1 -> 0)
          // flapPolygon.style.opacity = `${1 - Math.pow(p, 1.5)}`;
          // 수정 코드: 2단계 진행도(p)가 0.5(절반)만 되어도 완전히 투명해짐(0)
          const fadeSpeed = 8.0; // 이 숫자를 클수록 더 빨리 사라집니다 (예: 2.0 = 절반 지점, 3.0 = 1/3 지점)
          flapPolygon.style.opacity = `${Math.max(0, 1 - p * fadeSpeed)}`;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // 애니메이션 종료 후 초기화
          currentDay = nextDay;
          pageCurrent.textContent = currentDay;
          pageCurrent.style.clipPath = 'none';
          flapPolygon.setAttribute('points', '');
          flapPolygon.style.transform = 'none';
          flapPolygon.style.opacity = '1';
          isAnimating = false;
        }
      }

      requestAnimationFrame(animate);
    }

    tearBtn.addEventListener('click', triggerTearAnimation);
    calendar.addEventListener('click', triggerTearAnimation);
  </script>
</body>
</html>
