<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Background Scroll Animation</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #eaf4f7;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.wrap { width: min(1100px, 94vw); }

.stage {
  position: relative;
  height: 360px;
  overflow: hidden;
  border-radius: 24px;
  background: #dff3ff;
}

/* =========================================================
   1. 배경 영역
   ---------------------------------------------------------
   네가 나중에 만든 배경을 #backgroundTrack 안에 넣으면 된다.
   backgroundTrack 전체를 왼쪽으로 이동시켜서 트럭이 앞으로 가는
   것처럼 보이게 만드는 구조다.
   ========================================================= */
.background-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

.background-track {
  position: absolute;
  top: 0;
  left: 0;
  width: 200%;
  height: 100%;
  display: flex;
  will-change: transform;
}

.background-panel {
  position: relative;
  flex: 0 0 50%;
  width: 50%;
  height: 100%;
}

/* 현재 배경은 테스트용. 여기만 네 배경으로 교체하면 된다. */
.demo-sky {
  position: absolute;
  inset: 0 0 30% 0;
  background: linear-gradient(#dff3ff, #f5fbff);
}

.demo-ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 30%;
  background: linear-gradient(#b8c1c7 0 12%, #6f7478 12% 100%);
}

.demo-road-lines {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 52px;
  height: 5px;
  background: repeating-linear-gradient(
    to right,
    transparent 0 35px,
    rgba(255,255,255,.82) 35px 95px,
    transparent 95px 150px
  );
  opacity: .75;
}

/* =========================================================
   2. 트럭 위치
   ---------------------------------------------------------
   truckSvg의 X 위치는 '진입할 때만' 바뀐다.
   중앙에 도착하면 X는 고정되고,
   그 뒤에는 바퀴 회전 + 덜컹임만 계속된다.
   ========================================================= */
.truck-wrap {
  position: absolute;
  left: 0;
  bottom: calc(30% + 17px);
  width: 100%;
  height: 208px;
  pointer-events: none;
  z-index: 2;
}

.truck-svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 427px;
  height: 208px;
  overflow: visible;
  will-change: transform;
  transform-origin: 50% 100%;
}

/* SVG 내부 그룹을 회전시키기 위한 설정 */
#tireMid,
[id^="tireBack"],
[id^="tireFront"] {
  transform-box: fill-box;
  transform-origin: center;
  will-change: transform;
}

#truckbody {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  will-change: transform;
}

/* =========================================================
   3. 버튼
   ========================================================= */
.controls {
  margin-top: 16px;
  display: flex;
  gap: 10px;
}

.controls button {
  border: 0;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  background: #2e2928;
  color: #fff;
  font-weight: 700;
}

.controls button:hover {
  opacity: .88;
}
</style>
</head>
<body>
<main class="wrap">
  <div class="stage" id="stage">

    <!-- =====================================================
         배경

    <div class="background-layer">
      <div class="background-track" id="backgroundTrack">

        <!-- 첫 번째 패널 -->
        <div class="background-panel">
          <div class="demo-sky"></div>
          <div class="demo-ground"></div>
          <div class="demo-road-lines"></div>
          <!-- 여기에 네가 만든 배경 요소를 넣어도 된다. -->
        </div>

        <!-- 두 번째 패널: 첫 번째와 이어지도록 복제 -->
        <div class="background-panel">
          <div class="demo-sky"></div>
          <div class="demo-ground"></div>
          <div class="demo-road-lines"></div>
        </div>

      </div>
    </div>

  <!-- 아래에는 버튼만 남김 -->
  <div class="controls">
    <button id="toggle">일시정지</button>
    <button id="restart">처음부터</button>
  </div>
</main>

<script>
(() => {
  /* ========================================================
     ★ 여기만 수정하면 애니메이션을 직접 조절할 수 있다.
     ======================================================== */

  const SETTINGS = {
    // 트럭이 왼쪽에서 중앙으로 들어오는 속도 (px/sec)
    ENTRY_SPEED: 400,

    // 중앙에 도착한 뒤 배경이 왼쪽으로 움직이는 속도 (px/sec)
    BACKGROUND_SPEED: 280,

    // 바퀴 회전 속도 (deg/sec)
    WHEEL_SPEED: 840,

    // 덜컹거림의 전체 강도. 0 = 없음, 1 = 기본
    BOUNCE_POWER: 2,

    // 큰 차체 흔들림의 주기
    BOUNCE_FREQUENCY: 5.2,

    // 노면의 작은 진동 주기
    VIBRATION_FREQUENCY_1: 10.8,
    VIBRATION_FREQUENCY_2: 17.5,

    // 좌우로 기울어지는 정도
    TILT_POWER: 1.2,

    // 트럭의 크기. SVG viewBox 기준
    TRUCK_WIDTH: 427,
    TRUCK_HEIGHT: 208,
  };

  const stage = document.getElementById('stage');
  const truck = document.getElementById('truck7');
  const truckSvg = truck.closest('svg');
  const body = document.getElementById('truckbody');
  const backgroundTrack = document.getElementById('backgroundTrack');
  const toggle = document.getElementById('toggle');
  const restart = document.getElementById('restart');

  /* SVG 안에서 바퀴 그룹 자동으로 찾기 */
  const wheels = [
    ...document.querySelectorAll('#tireMid, [id^="tireBack"], [id^="tireFront"]')
  ];

  let stageWidth = stage.clientWidth;
  let x = -SETTINGS.TRUCK_WIDTH - 20;
  let targetX = 0;
  let wheelAngle = 0;
  let backgroundOffset = 0;
  let last = performance.now();
  let running = true;
  let state = 'enter'; // enter → cruise

  /* 트럭을 화면 정중앙에 놓는 X값 계산 */
  function updateTarget() {
    stageWidth = stage.clientWidth;
    targetX = (stageWidth - SETTINGS.TRUCK_WIDTH) / 2;
  }

  /* 처음부터 다시 시작 */
  function reset() {
    updateTarget();

    x = -SETTINGS.TRUCK_WIDTH - 20;
    wheelAngle = 0;
    backgroundOffset = 0;
    state = 'enter';

    backgroundTrack.style.transform = 'translate3d(0, 0, 0)';
    truckSvg.style.transform = 'translate3d(0, 0, 0)';
    body.style.transform = '';

    last = performance.now();
  }

  function animate(now) {
    const dt = Math.min((now - last) / 1000, 0.04);
    last = now;

    if (running) {
      /* ====================================================
         ① 처음에는 트럭이 왼쪽에서 중앙으로 이동
         ==================================================== */
      if (state === 'enter') {
        x += SETTINGS.ENTRY_SPEED * dt;

        if (x >= targetX) {
          x = targetX;
          state = 'cruise';
        }
      }

      /* ====================================================
         ② 중앙에 도착하면 트럭의 X 위치는 고정
            배경만 왼쪽으로 움직인다.
         ==================================================== */
      if (state === 'cruise') {
        backgroundOffset -= SETTINGS.BACKGROUND_SPEED * dt;

        /* 배경이 한 화면만큼 이동하면 처음으로 되돌림 */
        if (backgroundOffset <= -stageWidth) {
          backgroundOffset += stageWidth;
        }

        backgroundTrack.style.transform =
          `translate3d(${backgroundOffset.toFixed(2)}px, 0, 0)`;
      }

      /* ====================================================
         ③ 바퀴는 계속 회전
         ==================================================== */
      wheelAngle -= SETTINGS.WHEEL_SPEED * dt;

      /* ====================================================
         ④ 덜컹거림
         큰 움직임 + 작은 진동을 섞어서 자연스럽게 만든다.
         ==================================================== */
      const t = now * 0.001;

      const bigBounce =
        Math.sin(t * SETTINGS.BOUNCE_FREQUENCY) * 1.9;

      const roadVibration =
        Math.sin(t * SETTINGS.VIBRATION_FREQUENCY_1 + 0.4) * 0.85 +
        Math.sin(t * SETTINGS.VIBRATION_FREQUENCY_2 + 1.1) * 0.35;

      const bounceY =
        (bigBounce + roadVibration) * SETTINGS.BOUNCE_POWER;

      const tilt =
        (
          Math.sin(t * SETTINGS.BOUNCE_FREQUENCY + 0.55) * 0.48 +
          Math.sin(t * 12.0) * 0.14
        ) * SETTINGS.BOUNCE_POWER * SETTINGS.TILT_POWER;

      /* 트럭 전체가 위아래 + 살짝 회전 */
      const TRUCK_Y = 80;
      truckSvg.style.transform =
        `translate3d(${x.toFixed(2)}px, ${(TRUCK_Y + bounceY).toFixed(2)}px, 0) rotate(${tilt.toFixed(2)}deg)`;
      /* 차체만 미세하게 한 번 더 흔들어서 서스펜션 느낌 */
      const bodyBounce =
        Math.sin(t * 8.2 + 0.8) * 0.45 * SETTINGS.BOUNCE_POWER;

      body.style.transform =
        `translateY(${bodyBounce.toFixed(2)}px)`;

      /* 모든 바퀴 그룹 회전 */
      for (const wheel of wheels) {
        wheel.style.transform = `rotate(${wheelAngle.toFixed(2)}deg)`;
      }
    }

    requestAnimationFrame(animate);
  }

  /* 일시정지 / 재생 */
  toggle.addEventListener('click', () => {
    running = !running;
    toggle.textContent = running ? '일시정지' : '재생';
    last = performance.now();
  });

  /* 처음부터 */
  restart.addEventListener('click', () => {
    running = true;
    toggle.textContent = '일시정지';
    reset();
  });

  window.addEventListener('resize', updateTarget);

  updateTarget();
  requestAnimationFrame(animate);
})();
</script>
