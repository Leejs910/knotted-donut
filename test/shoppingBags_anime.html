<script>
/*
  ============================================================
  쇼핑백 애니메이션 설정
  숫자만 직접 바꿔서 원하는 느낌으로 조절하세요.
  ============================================================
*/
const SETTINGS = {

  // 전체 바운스 속도
  SPEED: 0.4,

  // 바닥에서 위로 튀는 최대 높이(px)
  BOUNCE_HEIGHT: 148,

  // 착지할 때 좌우로 퍼지는 압축 정도
  SQUASH: 0.1,

  // 착지할 때 위아래로 눌리는 정도
  // SQUASH와 함께 사용
  STRETCH: 0.1,

  // 그림자가 공중에서 작아지는 정도
  SHADOW_SHRINK: 0.35,

  // 처음부터 시작할 위치
  START_PHASE: 0
};

const bag = document.getElementById("shopping_bag");
const shadow = document.getElementById("shadow");

const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");

let paused = false;
let startTimestamp = null;
let pausedElapsed = SETTINGS.START_PHASE;
let rafId = null;

/*
  0 → 1 → 0 형태의 바운스.
  바닥에서는 0, 꼭대기에서는 1이 된다.
*/
function bounceCurve(phase) {
  return 4 * phase * (1 - phase);
}

function animate(timestamp) {
  if (startTimestamp === null) {
    startTimestamp = timestamp - pausedElapsed * 1000;
  }

  if (!paused) {
    const elapsed = (timestamp - startTimestamp) / 1000;
    const t = elapsed * SETTINGS.SPEED;

    /*
      한 사이클을 0~1로 반복.
    */
    const phase = ((t % 1) + 1) % 1;

    /*
      바닥 → 상승 → 정점 → 낙하 → 착지
    */
    const jump = bounceCurve(phase);

    /*
      가방 전체의 Y 위치.
      SVG 좌표계에서 위쪽이 음수.
    */
    const y = -jump * SETTINGS.BOUNCE_HEIGHT;

    /*
      착지 시점에만 아주 살짝 눌린다.
      0에 가까운 구간이 착지 구간.
    */
    const contact = Math.pow(1 - phase, 14);

    const scaleX = 1 + contact * SETTINGS.SQUASH;
    const scaleY = 1 - contact * SETTINGS.STRETCH;

    bag.style.transform =
      `translateY(${y.toFixed(2)}px) ` +
      `scale(${scaleX.toFixed(4)}, ${scaleY.toFixed(4)})`;

    /*
      공중에 뜨면 그림자가 작아진다.
      바닥에 내려오면 다시 커진다.
    */
    const shadowScale =
      1 - jump * SETTINGS.SHADOW_SHRINK;

    shadow.style.transform =
      `scaleX(${shadowScale.toFixed(4)})`;

    pausedElapsed = elapsed;
  }

  rafId = requestAnimationFrame(animate);
}

/*
  일시정지 / 재생
*/
pauseBtn.addEventListener("click", () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "재생" : "일시정지";

  if (paused) {
    if (startTimestamp !== null) {
      pausedElapsed =
        (performance.now() - startTimestamp) / 1000;
    }
  } else {
    startTimestamp =
      performance.now() - pausedElapsed * 1000;
  }
});

/*
  처음부터
*/
restartBtn.addEventListener("click", () => {
  paused = false;
  pauseBtn.textContent = "일시정지";

  pausedElapsed = SETTINGS.START_PHASE;
  startTimestamp = performance.now();

  bag.style.transform = "translateY(0) scale(1, 1)";
  shadow.style.transform = "scaleX(1)";
});

requestAnimationFrame(animate);
</script>
